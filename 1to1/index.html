<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title>일대일양육 암송구절</title>
    <style>
      body {
        font-family: "Noto Sans KR", sans-serif;
        background: #f6f6f6;
        padding: 10px;
        font-size: 1rem;
      }

      h1 {
        font-size: 1.5rem;
        text-align: center;
        margin-bottom: 10px;
      }

      /* --- 카테고리 휠 피커 --- */
      #category-select {
        display: block;
        width: 100%;
        max-width: 600px;
        margin: 0 auto 5px;
        height: 90px;
        overflow: hidden;
        border-radius: 6px;
        border: 1px solid #ccc;
        background-color: white;
        position: relative;
      }

      #category-select::before,
      #category-select::after {
        content: '';
        position: absolute;
        left: 0;
        right: 0;
        height: 30px;
        pointer-events: none;
        z-index: 1;
      }

      #category-select::before {
        top: 0;
        background: linear-gradient(to bottom, white, rgba(255, 255, 255, 0));
      }

      #category-select::after {
        bottom: 0;
        background: linear-gradient(to top, white, rgba(255, 255, 255, 0));
      }

      .category-wheel {
        height: 100%;
        overflow-y: auto;
        scroll-snap-type: y mandatory;
        scrollbar-width: none;
        -ms-overflow-style: none;
        -webkit-overflow-scrolling: touch;
        touch-action: pan-y;
      }

      .category-wheel::-webkit-scrollbar {
        display: none;
      }

      .category-item {
        height: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 10px;
        scroll-snap-align: center;
        scroll-snap-stop: always;
        font-size: 1rem;
        color: #999;
        transition: all 0.2s ease;
        cursor: pointer;
      }

      .category-item.selected {
        color: #000;
        font-weight: bold;
        font-size: 1.1rem;
      }

      .category-item.empty {
        color: #999;
        font-style: italic;
      }

      /* --- 1,2,3 번호 버튼 --- */
      .subnav {
        display: flex;
        justify-content: center;
        flex-wrap: nowrap;
        overflow-x: auto;
        gap: 4px;
        margin-bottom: 5px;
      }
      .subnav-btn {
        min-width: 30px;
        padding: 4px 0;
        background-color: #ddd;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.9rem;
        flex: 0 0 auto;
      }
      .subnav-btn.active,
      .subnav-btn:hover {
        background-color: #0084ff;
        color: #fff;
      }

      /* --- 구절 영역 --- */
      .verse-container {
        background: white;
        padding: 10px;
        border-radius: 8px;
        box-shadow: 0 0 5px rgba(0, 0, 0, 0.1);
        margin-bottom: 15px;
        width: 100%;
        max-width: 600px;
        margin-left: auto;
        margin-right: auto;
        box-sizing: border-box;
      }

      .verse-label {
        display: flex;
        width: 100%;
        gap: 4px;
        align-items: center;
        margin-bottom: 6px;
        font-size: 1.2rem;
      }

      .verse-label span,
      .verse-label button {
        flex: 1;
        text-align: center;
        font-size: 1.2rem;
        white-space: nowrap;
        padding: 6px 4px;
        border-radius: 4px;
        border: none;
        cursor: pointer;
      }

      .verse-label button#btn-check {
        background-color: #0084ff;
        color: white;
      }

      .verse-label button#btn-clean {
        background-color: #888;
        color: white;
      }

      textarea {
        width: 100%;
        height: 180px;
        padding: 8px;
        font-size: 1.2rem;
        line-height: 1.4;
        margin-bottom: 5px;
        box-sizing: border-box;
      }

      .result {
        font-size: 1.1rem;
        white-space: pre-wrap;
        margin-bottom: 4px;
      }

      .diff {
        background-color: #ffcccc;
      }

      .original-text {
        display: none;
        font-size: 1.1rem;
        font-weight: bold;
        margin-top: 4px;
        border-top: 1px solid #ddd;
        padding-top: 4px;
        white-space: pre-wrap;
      }

      .status {
        font-weight: bold;
      }

      button {
        cursor: pointer;
        border-radius: 4px;
        border: none;
        padding: 6px 0;
      }

      button:hover {
        opacity: 0.9;
      }

      @media (max-width: 600px) {
        .verse-label {
          font-size: 1rem;
        }
        .verse-label button,
        .verse-label span {
          font-size: 1rem;
        }
        textarea {
          font-size: 1rem;
          height: 160px;
        }
        #category-select {
          height: 120px;
        }
        #category-select::before,
        #category-select::after {
          height: 40px;
        }
        .category-item {
          font-size: 1rem;
          height: 40px;
        }
        .category-item.selected {
          font-size: 1.15rem;
        }
        .subnav-btn {
          font-size: 0.85rem;
          min-width: 28px;
          padding: 3px 0;
        }
      }
    </style>
  </head>
  <body>
    <div id="category-select">
      <div class="category-wheel" id="category-wheel"></div>
    </div>
    <div id="subnav" class="subnav"></div>
    <div id="practice-area"></div>

        { ref: "엡5:18", text: "술 취하지 말라 이는 방탕한 것이니 오직 성령으로 충만함을 받으라", cat: "그리스도가 다스리는 삶 | 13. 성령 충만한 삶" },
        { ref: "고전10:13", text: "사람이 감당할 시험 밖에는 너희가 당한 것이 없나니 오직 하나님은 미쁘사 너희가 감당하지 못할 시험 당함을 허락하지 아니하시고 시험 당할 즈음에 또한 피할 길을 내사 너희로 능히 감당하게 하시느니라", cat: "그리스도가 다스리는 삶 | 14. 시험을 이기는 삶" },
        { ref: "눅9:23", text: "또 무리에게 이르시되 아무든지 나를 따라오려거든 자기를 부인하고 날마다 제 십자가를 지고 나를 따를 것이니라", cat: "그리스도가 다스리는 삶 | 15. 순종하는 삶" },
        { ref: "벧전2:9", text: "그러나 너희는 택하신 족속이요 왕 같은 제사장들이요 거룩한 나라요 그의 소유가 된 백성이니 이는 너희를 어두운 데서 불러 내어 그의 기이한 빛에 들어가게 하신 이의 아름다운 덕을 선포하게 하려 하심이라", cat: "그리스도가 다스리는 삶 | 16. 사역하는 삶" },
      ];

      const categories = [...new Set(verses.map((v) => v.cat))];
      let currentCategory = "";
      let currentVerseIndex = 0;

      function initCategorySelect() {
        const wheel = document.getElementById("category-wheel");

        // 빈 옵션 추가
        const emptyItem = document.createElement("div");
        emptyItem.className = "category-item empty";
        emptyItem.textContent = "-";
        emptyItem.dataset.value = "";
        wheel.appendChild(emptyItem);

        // 카테고리 항목 추가
        categories.forEach((cat) => {
          const item = document.createElement("div");
          item.className = "category-item";
          item.textContent = cat;
          item.dataset.value = cat;
          wheel.appendChild(item);
        });

        // 마지막에 빈 옵션 추가
        const emptyItemEnd = document.createElement("div");
        emptyItemEnd.className = "category-item empty";
        emptyItemEnd.textContent = "-";
        emptyItemEnd.dataset.value = "";
        wheel.appendChild(emptyItemEnd);

        // 휠 이벤트 처리
        let isScrolling = false;
        wheel.addEventListener("wheel", (e) => {
          e.preventDefault();
          if (isScrolling) return;

          const delta = e.deltaY > 0 ? 30 : -30;
          wheel.scrollTop += delta;

          // 스크롤 후 선택 업데이트
          setTimeout(() => {
            updateSelectedCategory();
          }, 100);
        });

        // 스크롤 이벤트로 선택 업데이트
        wheel.addEventListener("scroll", () => {
          if (!isScrolling) {
            updateSelectedCategory();
          }
        });

        // 터치 이벤트 (모바일) - 개선된 스와이프 제스처
        let touchStartY = 0;
        let touchStartTime = 0;
        let touchStartScrollTop = 0;
        let isTouching = false;
        let velocity = 0;
        let lastTouchY = 0;
        let lastTouchTime = 0;
        let momentumAnimation = null;

        wheel.addEventListener("touchstart", (e) => {
          isTouching = true;
          touchStartY = e.touches[0].clientY;
          touchStartTime = Date.now();
          touchStartScrollTop = wheel.scrollTop;
          lastTouchY = touchStartY;
          lastTouchTime = touchStartTime;
          velocity = 0;
          
          // 기존 관성 애니메이션 취소
          if (momentumAnimation) {
            cancelAnimationFrame(momentumAnimation);
            momentumAnimation = null;
          }
        }, { passive: true });

        wheel.addEventListener("touchmove", (e) => {
          if (!isTouching) return;
          
          e.preventDefault();
          const touchY = e.touches[0].clientY;
          const currentTime = Date.now();
          
          // 속도 계산
          if (lastTouchTime > 0) {
            const timeDelta = currentTime - lastTouchTime;
            const distanceDelta = lastTouchY - touchY;
            if (timeDelta > 0) {
              velocity = distanceDelta / timeDelta;
            }
          }
          
          const delta = touchStartY - touchY;
          wheel.scrollTop = touchStartScrollTop + delta;
          
          lastTouchY = touchY;
          lastTouchTime = currentTime;
        }, { passive: false });

        wheel.addEventListener("touchend", (e) => {
          if (!isTouching) return;
          isTouching = false;
          
          const touchEndTime = Date.now();
          const touchDuration = touchEndTime - touchStartTime;
          const touchDistance = touchStartY - lastTouchY;
          
          // 빠른 스와이프 감지 (관성 스크롤)
          if (touchDuration < 300 && Math.abs(touchDistance) > 10) {
            const itemHeight = wheel.querySelector(".category-item")?.offsetHeight || 40;
            const momentum = velocity * 200; // 관성 배율
            
            let targetScroll = wheel.scrollTop + momentum;
            const maxScroll = wheel.scrollHeight - wheel.clientHeight;
            targetScroll = Math.max(0, Math.min(targetScroll, maxScroll));
            
            // 부드러운 관성 스크롤
            const startScroll = wheel.scrollTop;
            const distance = targetScroll - startScroll;
            const duration = Math.min(500, Math.abs(distance) * 2);
            const startTime = Date.now();
            
            function animate() {
              const elapsed = Date.now() - startTime;
              const progress = Math.min(elapsed / duration, 1);
              // ease-out 함수
              const easeProgress = 1 - Math.pow(1 - progress, 3);
              
              wheel.scrollTop = startScroll + (distance * easeProgress);
              
              if (progress < 1) {
                momentumAnimation = requestAnimationFrame(animate);
              } else {
                // 스크롤 완료 후 가장 가까운 항목으로 스냅
                snapToNearestItem();
              }
            }
            
            momentumAnimation = requestAnimationFrame(animate);
          } else {
            // 느린 스와이프나 탭의 경우 바로 스냅
            setTimeout(() => {
              snapToNearestItem();
            }, 100);
          }
        }, { passive: true });

        // 가장 가까운 항목으로 스냅하는 함수
        function snapToNearestItem() {
          const items = wheel.querySelectorAll(".category-item");
          const wheelCenter = wheel.clientHeight / 2;
          const wheelScrollTop = wheel.scrollTop;
          
          let nearestItem = null;
          let minDistance = Infinity;

          items.forEach((item) => {
            const itemTop = item.offsetTop;
            const itemHeight = item.offsetHeight;
            const itemCenter = itemTop - wheelScrollTop + (itemHeight / 2);
            const distance = Math.abs(itemCenter - wheelCenter);

            if (distance < minDistance) {
              minDistance = distance;
              nearestItem = item;
            }
          });

          if (nearestItem) {
            const itemTop = nearestItem.offsetTop;
            const itemHeight = nearestItem.offsetHeight;
            const targetScroll = itemTop - wheelCenter + (itemHeight / 2);
            
            isScrolling = true;
            wheel.scrollTo({
              top: targetScroll,
              behavior: "smooth"
            });
            
            setTimeout(() => {
              updateSelectedCategory();
              isScrolling = false;
            }, 300);
          }
        }

        // 클릭 이벤트
        wheel.addEventListener("click", (e) => {
          if (e.target.classList.contains("category-item")) {
            const item = e.target;
            const itemTop = item.offsetTop;
            const itemHeight = item.offsetHeight;
            const wheelCenter = wheel.clientHeight / 2;
            const scrollTo = itemTop - wheelCenter + (itemHeight / 2);
            
            isScrolling = true;
            wheel.scrollTo({
              top: scrollTo,
              behavior: "smooth"
            });
            
            setTimeout(() => {
              updateSelectedCategory();
              isScrolling = false;
            }, 300);
          }
        });

        function updateSelectedCategory() {
          const items = wheel.querySelectorAll(".category-item");
          const wheelCenter = wheel.clientHeight / 2;
          const wheelScrollTop = wheel.scrollTop;
          
          let selectedItem = null;
          let minDistance = Infinity;

          items.forEach((item) => {
            const itemTop = item.offsetTop;
            const itemHeight = item.offsetHeight;
            const itemCenter = itemTop - wheelScrollTop + (itemHeight / 2);
            const distance = Math.abs(itemCenter - wheelCenter);

            if (distance < minDistance) {
              minDistance = distance;
              selectedItem = item;
            }
          });

          // 선택 상태 업데이트
          items.forEach((item) => {
            item.classList.remove("selected");
          });

          if (selectedItem) {
            selectedItem.classList.add("selected");
            const newCategory = selectedItem.dataset.value || "";
            if (newCategory !== currentCategory) {
              currentCategory = newCategory;
              currentVerseIndex = 0;
              renderSubNav();
              renderVerse();
            }
          }
        }

        // 초기 스크롤 위치 설정 (첫 번째 항목을 가운데로)
        setTimeout(() => {
          const firstItem = wheel.querySelector(".category-item");
          if (firstItem) {
            const itemHeight = firstItem.offsetHeight;
            wheel.scrollTop = firstItem.offsetTop - (wheel.clientHeight / 2) + (itemHeight / 2);
          }
        }, 50);
      }

      function renderSubNav() {
        const subnav = document.getElementById("subnav");
        subnav.innerHTML = "";
        if (!currentCategory) return;

        const filtered = verses.filter((v) => v.cat === currentCategory);
        filtered.forEach((v, idx) => {
          const btn = document.createElement("button");
          btn.textContent = idx + 1;
          btn.className = "subnav-btn" + (idx === currentVerseIndex ? " active" : "");
          btn.onclick = () => {
            currentVerseIndex = idx;
            renderSubNav();
            renderVerse();
          };
          subnav.appendChild(btn);
        });
      }

      function renderVerse() {
        const area = document.getElementById("practice-area");
        area.innerHTML = "";

        if (!currentCategory) return;

        const filtered = verses.filter((v) => v.cat === currentCategory);
        const verse = filtered[currentVerseIndex];
        if (!verse) return;

        const div = document.createElement("div");
        div.className = "verse-container";
        div.innerHTML = `
          <div class="verse-label">
            <span class="ref-text">${verse.ref}</span>
            <span></span>
            <span id="status-${verse.ref}" class="status"></span>
            <button id="btn-${verse.ref}">확인</button>
            <button id="clean-${verse.ref}">초기화</button>
          </div>
          <textarea id="input-${verse.ref}" placeholder="직접 입력해보세요..."></textarea>
          <div id="result-${verse.ref}" class="result"></div>
          <div id="original-${verse.ref}" class="original-text"></div>
        `;
        area.appendChild(div);

        const textarea = document.getElementById(`input-${verse.ref}`);
        const checkBtn = document.getElementById(`btn-${verse.ref}`);
        const cleanBtn = document.getElementById(`clean-${verse.ref}`);
        const status = document.getElementById(`status-${verse.ref}`);
        const originalDiv = document.getElementById(`original-${verse.ref}`);
        const resultDiv = document.getElementById(`result-${verse.ref}`);

        checkBtn.onclick = () => {
          const original = verse.text.replace(/\s+/g, "");
          const userInput = textarea.value.replace(/\s+/g, "");
          let correct = userInput === original;
          status.textContent = correct ? "정답" : "오답";
          status.style.color = correct ? "green" : "red";

          // 차이 표시
          let result = "";
          const maxLen = Math.max(original.length, userInput.length);
          for (let i = 0; i < maxLen; i++) {
            if (original[i] !== userInput[i]) {
              result += `<span class="diff">${userInput[i] || ""}</span>`;
            } else {
              result += userInput[i] || "";
            }
          }
          resultDiv.innerHTML = result || "<span style='color:#999;'>입력 내용이 없습니다.</span>";
          originalDiv.textContent = verse.text;
          originalDiv.style.display = "block";
        };

        cleanBtn.onclick = () => {
          textarea.value = "";
          resultDiv.innerHTML = "";
          originalDiv.style.display = "none";
          status.textContent = "";
        };

        textarea.addEventListener("keydown", (e) => {
          if (e.key === "Enter") {
            e.preventDefault();
            checkBtn.click();
          }
        });
      }

      initCategorySelect();
    </script>
  </body>
</html>
